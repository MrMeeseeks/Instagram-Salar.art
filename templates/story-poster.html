<!-- Story poster template (1080x1920). Put the photo next to this file as photo.jpg, edit the text, render with Playwright (see reel-editor). Keeps clear of IG top bar + reply box. -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#F6C744;font-family:"Inter Display","Inter",sans-serif;color:#111;overflow:hidden;
 background-image:radial-gradient(#11111114 3px,transparent 3px);background-size:36px 36px;
 display:flex;flex-direction:column;align-items:center;padding:260px 60px 330px;text-align:center}
.pill{background:#111;color:#F6C744;font-weight:800;font-size:40px;letter-spacing:6px;padding:14px 40px;border-radius:999px}
h1{font-weight:900;font-size:128px;line-height:.92;letter-spacing:-4px;margin-top:26px}
h1 span{display:block;font-size:96px;letter-spacing:-2px}
.photo{margin-top:40px;width:500px;transform:rotate(-3deg);background:#fff;padding:18px 18px 64px;box-shadow:0 20px 44px #0004;border-radius:10px;position:relative}
.photo img{width:100%;display:block;border-radius:4px}
.photo .cap{position:absolute;bottom:16px;left:0;width:100%;font-weight:800;font-size:28px;letter-spacing:1px}
.where{font-weight:900;font-size:60px;letter-spacing:-1px;margin-top:46px}
.addr{font-weight:600;font-size:34px;margin-top:6px}
.price{display:flex;gap:20px;margin-top:24px}
.price div{background:#fff;border:5px solid #111;border-radius:20px;padding:10px 28px;font-weight:800;font-size:42px}
.fc{font-weight:700;font-size:32px;margin-top:20px}
.sticker{flex:1;min-height:110px;display:flex;align-items:center;font-weight:700;font-size:26px;opacity:.5}
.brand{font-weight:900;font-size:38px;letter-spacing:3px}
</style></head><body>
<div class="pill">TOMORROW · SUN NOV 1</div>
<h1>GET DRAWN<span>LIVE!</span></h1>
<div class="photo"><img src="photo.jpg"><div class="cap">real pen · real paper · never AI</div></div>
<div class="where">Parvaneh Market</div>
<div class="addr">The Pipe Shop · Shipyards, North Van</div>
<div class="price"><div>$15 B&amp;W</div><div>$25 colour</div></div>
<div class="fc">First come, first drawn ✏️</div>
<div class="sticker"></div>
<div class="brand">SMILE A MILE ART · SALAR.ART</div>
</body></html>
